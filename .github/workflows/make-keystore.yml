name: Make Keystore (run once)
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'password (english letters and numbers, min 8 chars)'
        required: true
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -keystore asia-release.jks -alias asia -keyalg RSA -keysize 2048 -validity 36500 -storepass "$PW" -keypass "$PW" -dname "CN=Asia Shop, O=Asia, C=IR"
          base64 -w0 asia-release.jks > keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            asia-release.jks
            keystore-base64.txt
